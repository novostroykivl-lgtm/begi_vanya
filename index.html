<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Беги, Ваня!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&family=Nunito:wght@600;800&display=swap" media="print" onload="this.media='all'">
<style>
  /* Игровой экран 3:2 по центру, тёплый «деревянный» фон дома; одна тема. */
  :root {
    color-scheme: dark;
    --ground: #2b1d16;     /* тёмное дерево вокруг дома */
    --ink: #fff8ef;        /* текст на затемнении */
    --shade: rgba(28, 16, 10, .62);
    --accent: #e0506f;     /* кнопка, цвет Лениной кофточки */
    --gold: #ffd84a;       /* результат, звёздочки */
    --display: "Rubik Mono One", "Segoe UI Black", "Arial Black", sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ground); overflow: hidden; overscroll-behavior: none; }
  body {
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding-inline: max(16px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
    font-family: var(--body); color: var(--ink);
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: relative; container-type: inline-size;
    width: min(100%, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 1.5));
    aspect-ratio: 3 / 2; max-width: 100%;
  }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 1.2cqw;
    align-items: center; justify-content: center; text-align: center;
    background: var(--shade); color: var(--ink); padding-inline: 16px;
  }
  #overlay[hidden] { display: none; }
  #overlay h1 {
    font-family: var(--display); font-weight: 400; margin: 0 0 1cqw;
    font-size: clamp(22px, 6.4cqw, 60px); line-height: 1.05; text-wrap: balance;
    text-shadow: 0 .5cqw 0 var(--ground);
  }
  #overlay p { font-size: clamp(13px, 2.1cqw, 21px); font-weight: 600; margin: 0; max-width: 34em; text-wrap: balance; }
  #ovText { display: flex; flex-direction: column; gap: .8cqw; }
  #overlay .big { font-size: clamp(17px, 3.2cqw, 32px); font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; }
  #overlay button {
    margin-top: 1.4cqw; font: inherit; font-weight: 800; font-size: clamp(16px, 2.4cqw, 24px);
    padding: .5em 1.6em; border-radius: 999px; border: 3px solid var(--ink);
    background: var(--accent); color: var(--ink); cursor: pointer;
    box-shadow: 0 .45cqw 0 var(--ground);
  }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ground); }
  #overlay button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  #overlay button:disabled { opacity: .5; cursor: wait; }
  #overlay .hint { opacity: .7; font-size: clamp(12px, 1.6cqw, 15px); }
  .touch-only, #rotate { display: none; }
  @media (pointer: coarse) {
    .touch-only { display: inline; }
    .kb-only { display: none; }
  }
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; color: var(--gold); }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="overlay">
    <h1 id="ovTitle">Беги, Ваня!</h1>
    <div id="ovText">
      <p>Лена со сковородкой уже идёт за тобой. Убегай по дому как можно дольше!</p>
      <p>
        <span class="kb-only">Управление: <b>стрелки</b> или <b>WASD</b></span>
        <span class="touch-only">Положи палец на экран и веди в нужную сторону</span>
      </p>
    </div>
    <button id="ovButton" disabled>Загрузка…</button>
    <p class="hint kb-only">или нажми пробел</p>
  </div>
</div>
<div id="rotate">↻ Поверни телефон горизонтально, так удобнее</div>

function photoHead({ src, x, y, w, h }) {
  const id = 'photoClip' + (++clipCounter);
  return `
  <defs><clipPath id="${id}"><circle cx="100" cy="92" r="62"/></clipPath></defs>
  <circle cx="100" cy="92" r="62" fill="#fff"/>
  <image href="${encodeURI(src)}" x="${x}" y="${y}" width="${w}" height="${h}"
    clip-path="url(#${id})" preserveAspectRatio="none"/>
  <circle cx="100" cy="92" r="62" fill="none" stroke-width="4"/>`;
}

}

<script>

const MAP = [

const ROOMS = [

const solid = MAP.map(row => [...row].map(ch => ch === '#'));
for (const f of FURNITURE)
  for (let y = f.y; y < f.y + f.h; y++)
    for (let x = f.x; x < f.x + f.w; x++) solid[y][x] = true;

function isSolidTile(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return true;
  return solid[ty][tx];
}

/* ================= ФРАЗЫ ================= */
const LENA_PHRASES = [
  'Ваня, стой!', 'А ну иди сюда!', 'Кто посуду не помыл?!', 'Я тебе покажу!',
  'Куда побежал?!', 'Ваня!!!', 'Носки опять на полу?!', 'Стой, кому говорю!',
];
const VANYA_PHRASES = ['Ааа!', 'Лена, я всё объясню!', 'Помогите!', 'Я не виноват!', 'Только не сковородкой!'];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ================= ХОЛСТ ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let scaleK = 1;
function resize() {
  scaleK = Math.min(2.5, Math.max(1, canvas.clientWidth * (window.devicePixelRatio || 1) / W));
  canvas.width = Math.round(W * scaleK);
  canvas.height = Math.round(H * scaleK);
}
addEventListener('resize', resize);
resize();

const OUTLINE = '#2b1d16';
function rr(c, x, y, w, h, r, fill, stroke = OUTLINE, lw = 2) {
  c.beginPath();
  c.roundRect(x, y, w, h, r);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); }
}
function circle(c, x, y, r, fill, stroke = OUTLINE, lw = 2) {
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(); }
}
// «Объёмный» блок: светлая крышка + тёмная передняя стенка
function block(c, x, y, w, h, top, front, fh = 9) {
  rr(c, x, y, w, h, 5, front);
  rr(c, x, y, w, h - fh, 5, top);
}

/* ================= ФОН: ПОЛЫ, СТЕНЫ, КОВРЫ ================= */
const bg = document.createElement('canvas');
function buildBackground() {
  const K = 2;
  bg.width = W * K; bg.height = H * K;
  const b = bg.getContext('2d');
  b.scale(K, K);

  for (const r of ROOMS) {
    const x0 = r.x * T, y0 = r.y * T, w = r.w * T, h = r.h * T;
    b.save();
    b.beginPath(); b.rect(x0, y0, w, h); b.clip();
    if (r.floor === 'checker') {
      for (let y = y0; y < y0 + h; y += 20)
        for (let x = x0; x < x0 + w; x += 20) {
          b.fillStyle = ((x + y) / 20) % 2 ? '#dcc9a8' : '#f3ead8';
          b.fillRect(x, y, 20, 20);
        }
    } else if (r.floor === 'tiles') {
      b.fillStyle = '#a9cfd9'; b.fillRect(x0, y0, w, h);
      for (let y = y0; y < y0 + h; y += 20)
        for (let x = x0; x < x0 + w; x += 20) {
          b.fillStyle = '#d4ecf2'; b.fillRect(x + 1, y + 1, 18, 18);
        }
    } else if (r.floor === 'planks') {
      let row = 0;
      for (let y = y0; y < y0 + h; y += 16, row++) {
        b.fillStyle = row % 2 ? r.c1 : r.c2;
        b.fillRect(x0, y, w, 16);
        b.fillStyle = 'rgba(0,0,0,.12)';
        b.fillRect(x0, y + 15, w, 1);
        for (let x = x0 + (row % 3) * 37; x < x0 + w; x += 110) b.fillRect(x, y, 1, 16);
      }
    } else if (r.floor === 'carpet') {
      b.fillStyle = '#9db48a'; b.fillRect(x0, y0, w, h);
      b.fillStyle = 'rgba(255,255,255,.12)';
      for (let i = 0; i < 400; i++) b.fillRect(x0 + Math.random() * w, y0 + Math.random() * h, 2, 2);
    }
    b.restore();
  }

  // пороги в дверных проёмах
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const inWallLine = y === 7 || ((x === 9 && y < 7) || x === 15);
      if (MAP[y][x] === '.' && inWallLine) {
        b.fillStyle = '#b08560'; b.fillRect(x * T, y * T, T, T);
        b.fillStyle = 'rgba(0,0,0,.15)';
        b.fillRect(x * T, y * T + T / 2, T, 1);
      }
    }

  // ковры
  for (const r of RUGS) {
    const x = r.x * T + 6, y = r.y * T + 6, w = r.w * T - 12, h = r.h * T - 12;
    if (r.round) {
      b.beginPath(); b.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
      b.fillStyle = r.c; b.fill();
      b.beginPath(); b.ellipse(x + w / 2, y + h / 2, w / 2 - 10, h / 2 - 10, 0, 0, Math.PI * 2);
      b.strokeStyle = r.c2; b.lineWidth = 3; b.stroke();
    } else {
      rr(b, x, y, w, h, 6, r.c, null);
      rr(b, x + 7, y + 7, w - 14, h - 14, 4, null, r.c2, 3);
    }
  }

  // названия комнат
  b.font = 'bold 22px Nunito, "Segoe UI", sans-serif';
  b.textAlign = 'center';
  b.fillStyle = 'rgba(60,35,20,.3)';
  for (const r of ROOMS) b.fillText(r.name, (r.x + r.w / 2) * T, (r.y + r.h / 2) * T + 8);

  // стены: светлая «крышка» и тёмная стенка, если под стеной пол
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      if (MAP[y][x] !== '#') continue;
      const floorBelow = y + 1 < ROWS && MAP[y + 1][x] === '.';
      b.fillStyle = '#4e3526'; b.fillRect(x * T, y * T, T, T);
      b.fillStyle = '#7b5a44'; b.fillRect(x * T, y * T, T, floorBelow ? T - 12 : T);
      b.fillStyle = 'rgba(0,0,0,.08)'; b.fillRect(x * T, y * T, 1, T);
    }
  // тень от стен на полу
  for (let y = 1; y < ROWS; y++)
    for (let x = 0; x < COLS; x++)
      if (MAP[y][x] === '.' && MAP[y - 1][x] === '#') {
        b.fillStyle = 'rgba(0,0,0,.12)'; b.fillRect(x * T, y * T, T, 6);
      }
}

/* ================= МЕБЕЛЬ ================= */
function drawFurniture(f) {
  const c = ctx;
  const x = f.x * T + 3, y = f.y * T + 3, w = f.w * T - 6, h = f.h * T - 6;
  switch (f.t) {
    case 'counter': {
      block(c, x, y, w, h, '#eadfc8', '#b39b78');
      // мойка
      rr(c, x + 48, y + 5, 30, 18, 4, '#aeb9c1');
      // плита
      rr(c, x + w - 42, y + 3, 38, 23, 3, '#3d3d3d');
      for (const [ox, oy] of [[9, 7], [27, 7], [9, 18], [27, 18]]) circle(c, x + w - 42 + ox, y + 1 + oy, 4, '#666', '#999', 1.5);
      break;
    }
    case 'fridge':
      block(c, x, y - 4, w, h + 4, '#f4f7f9', '#c5ccd2', 12);
      rr(c, x + w - 9, y + 2, 3, 14, 1, '#9aa4ab', null);
      break;
    case 'table':
      block(c, x + 4, y + 4, w - 8, h - 8, '#b07845', '#8a5a30');
      for (const ox of [22, w / 2, w - 22]) circle(c, x + ox, y + 24, 8, '#fff', '#c9c9c9', 2);
      circle(c, x + w / 2, y + h / 2 + 4, 4, '#e0403a', null);
      break;
    case 'bath':
      block(c, x, y, w, h, '#ffffff', '#cfd8dc');
      rr(c, x + 7, y + 5, w - 22, h - 20, 8, '#8fd0ef', '#78b7d4', 2);
      circle(c, x + w - 9, y + 12, 3, '#b0b8bd', null);
      break;
    case 'sink':
      block(c, x + 2, y, w - 4, h, '#ffffff', '#cfd8dc');
      c.beginPath(); c.ellipse(x + w / 2, y + 12, 9, 7, 0, 0, Math.PI * 2);
      c.fillStyle = '#9fd6ee'; c.fill(); c.strokeStyle = '#78b7d4'; c.lineWidth = 1.5; c.stroke();
      break;
    case 'toilet':
      rr(c, x + 6, y + h - 12, w - 12, 12, 3, '#eef2f4');
      c.beginPath(); c.ellipse(x + w / 2, y + 12, 11, 12, 0, 0, Math.PI * 2);
      c.fillStyle = '#fff'; c.fill(); c.strokeStyle = OUTLINE; c.lineWidth = 2; c.stroke();
      c.beginPath(); c.ellipse(x + w / 2, y + 12, 6, 7, 0, 0, Math.PI * 2);
      c.fillStyle = '#bfe3f2'; c.fill();
      break;
    case 'wardrobe':
      block(c, x, y - 8, w, h + 8, '#8b5a3c', '#6d4430', 12);
      c.strokeStyle = '#5a3624'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x + w / 2, y - 4); c.lineTo(x + w / 2, y + h - 14); c.stroke();
      circle(c, x + w / 2 - 5, y + 10, 2, '#e1b563', null);
      circle(c, x + w / 2 + 5, y + 10, 2, '#e1b563', null);
      break;
    case 'nightstand':
      block(c, x + 3, y + 3, w - 6, h - 6, '#a0694a', '#7a4b33');
      circle(c, x + w / 2, y + 13, 7, '#ffe27a', '#d6b24a', 2);
      break;
    case 'bed':
      block(c, x, y, w, h, '#7a4b2f', '#5b3622', 8);
      rr(c, x + 5, y + 5, w - 10, h - 18, 6, '#f3f5fb', null);
      rr(c, x + 8, y + 8, w / 2 - 12, 18, 6, '#ffffff', '#cfd4e2', 1.5);
      rr(c, x + w / 2 + 4, y + 8, w / 2 - 12, 18, 6, '#ffffff', '#cfd4e2', 1.5);
      rr(c, x + 3, y + 34, w - 6, h - 46, 6, '#e57a8f');
      c.strokeStyle = '#c95d73'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(x + 6, y + 44); c.lineTo(x + w - 6, y + 44); c.stroke();
      break;
    case 'tv':
      block(c, x, y, w, h, '#5a4033', '#3e2b21', 6);
      rr(c, x + 6, y + 6, 10, h - 18, 2, '#1f1f1f');
      rr(c, x + 8, y + 9, 6, h - 24, 1, '#4d86c7', null);
      break;
    case 'coffee':
      block(c, x + 4, y + 4, w - 8, h - 8, '#9a6a44', '#74502f', 7);
      circle(c, x + 20, y + 14, 5, '#fff', '#b5b5b5', 1.5);
      rr(c, x + w - 32, y + 8, 16, 11, 2, '#6fa8dc', null);
      break;
    case 'sofa':
      block(c, x, y, w, h, '#3f8f8b', '#2e6e6b', 8);
      rr(c, x, y + h - 16, w, 14, 5, '#357a76');           // спинка
      rr(c, x, y, 12, h - 4, 4, '#357a76');                 // подлокотники
      rr(c, x + w - 12, y, 12, h - 4, 4, '#357a76');
      c.strokeStyle = '#2e6e6b'; c.lineWidth = 2;
      for (let i = 1; i < 3; i++) {
        const cx = x + 12 + (w - 24) * i / 3;
        c.beginPath(); c.moveTo(cx, y + 3); c.lineTo(cx, y + h - 17); c.stroke();
      }
      break;
    case 'armchair':
      block(c, x + 2, y + 2, w - 4, h - 4, '#e08a45', '#b86a2e', 7);
      rr(c, x + 2, y + h - 14, w - 4, 10, 4, '#c97535');
      break;
    case 'shelf': {
      block(c, x, y, w, h, '#8b5a3c', '#6d4430', 6);
      const colors = ['#e05252', '#4d86c7', '#f2c14e', '#57a773', '#9b6bc9'];
      if (w > h) {
        for (let i = 0, bx = x + 5; bx < x + w - 8; i++, bx += 8) rr(c, bx, y + 5, 6, h - 16, 1, colors[i % 5], null);
      } else {
        for (let i = 0, by = y + 5; by < y + h - 12; i++, by += 8) rr(c, x + 5, by, w - 10, 6, 1, colors[i % 5], null);
      }
      break;
    }
    case 'plant':
      rr(c, x + 9, y + 16, w - 18, h - 16, 4, '#c0673a');
      circle(c, x + w / 2 - 7, y + 10, 8, '#4f9d4a');
      circle(c, x + w / 2 + 7, y + 10, 8, '#4f9d4a');
      circle(c, x + w / 2, y + 3, 9, '#63b35d');
      break;
    case 'desk':
      block(c, x, y, w, h, '#b07845', '#8a5a30', 8);
      rr(c, x + w / 2 - 16, y + 3, 32, 18, 2, '#9aa4ab');
      rr(c, x + w / 2 - 13, y + 5, 26, 12, 1, '#6fb2e8', null);
      circle(c, x + 18, y + 12, 5, '#fff', '#b5b5b5', 1.5);
      break;
  }
}

/* ================= СПРАЙТЫ ПЕРСОНАЖЕЙ ================= */
function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}
const svgUrl = svg => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

// Тело из SVG + голова-фото в круге. Если фото не нашлось — рисованная голова.
async function makeSprite(bodySvg, fullCartoonSvg, crop) {
  const R = S * 2;
  const c = document.createElement('canvas');
  c.width = Math.round(200 * R); c.height = Math.round(320 * R);
  const g = c.getContext('2d');
  g.scale(R, R);
  try {
    const [body, photo] = await Promise.all([loadImage(svgUrl(bodySvg)), loadImage(encodeURI(crop.src))]);
    g.drawImage(body, 0, 0, 200, 320);
    g.save();
    g.beginPath(); g.arc(100, 92, 62, 0, Math.PI * 2);
    g.fillStyle = '#fff'; g.fill(); g.clip();
    g.drawImage(photo, crop.x, crop.y, crop.w, crop.h);
    g.restore();
    circle(g, 100, 92, 62, null, OUTLINE, 4);
  } catch (e) {
    g.drawImage(await loadImage(svgUrl(fullCartoonSvg)), 0, 0, 200, 320);
  }
  return c;
}

/* ================= ПЕРСОНАЖИ И СОСТОЯНИЕ ================= */
const vanya = { x: 0, y: 0, phase: 0, moving: false, say: '', sayT: 0, sayCd: 0 };
const lena  = { x: 0, y: 0, phase: 0, moving: false, say: '', sayT: 0, sayCd: 0, wait: 0 };
let state = 'loading';   // loading | menu | play | over
let time = 0, clock = 0, hitT = 0, shake = 0, newRecord = false;
let record = 0;
try { record = parseFloat(localStorage.getItem('begiVanyaRecord')) || 0; } catch (e) {}

function reset() {
  vanya.x = 8.5 * T; vanya.y = 10.5 * T; vanya.say = ''; vanya.sayT = 0; vanya.sayCd = 2;
  lena.x = 18.5 * T; lena.y = 4.5 * T;
  lena.say = 'Ваня!!!'; lena.sayT = 1.6; lena.sayCd = 3; lena.wait = 1.2;
  vanya.moving = lena.moving = false;
  time = 0; hitT = 0; newRecord = false;
}

/* ================= ДВИЖЕНИЕ И СТОЛКНОВЕНИЯ ================= */
// хитбокс вокруг ступней персонажа
function hits(x, y) {
  const x0 = Math.floor((x - 12) / T), x1 = Math.floor((x + 12 - 0.01) / T);
  const y0 = Math.floor((y - 10) / T), y1 = Math.floor((y + 4 - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (isSolidTile(tx, ty)) return true;
  return false;
}
function move(e, dx, dy) {
  if (dx && !hits(e.x + dx, e.y)) e.x += dx;
  if (dy && !hits(e.x, e.y + dy)) e.y += dy;
}

// Поиск пути (в ширину) по клеткам: куда Лене шагнуть дальше
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function nextStep(fx, fy, tx, ty) {
  const start = fy * COLS + fx, goal = ty * COLS + tx;
  if (start === goal) return null;
  const prev = new Int16Array(COLS * ROWS).fill(-1);
  prev[start] = start;
  const q = [start];
  for (let head = 0; head < q.length; head++) {
    const cur = q[head];
    if (cur === goal) break;
    const cx = cur % COLS, cy = (cur / COLS) | 0;
    for (const [ox, oy] of DIRS) {
      const nx = cx + ox, ny = cy + oy;
      if (isSolidTile(nx, ny)) continue;
      const n = ny * COLS + nx;
      if (prev[n] !== -1) continue;
      prev[n] = cur;
      q.push(n);
    }
  }
  if (prev[goal] === -1) return null;
  let cur = goal;
  while (prev[cur] !== start) cur = prev[cur];
  return [cur % COLS, (cur / COLS) | 0];
}

/* ================= УПРАВЛЕНИЕ ================= */
const keys = {};
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const ovButton = document.getElementById('ovButton');

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && !overlay.hidden && !ovButton.disabled) start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; endJoy(); });
ovButton.addEventListener('click', start);

// Сенсорный джойстик: появляется там, где коснулся пальцем (координаты в CSS-пикселях)
const JOY_R = 50;
const joy = { id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
function endJoy(e) {
  if (e && e.pointerId !== joy.id) return;
  joy.id = null; joy.dx = joy.dy = 0;
}
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play' || joy.id !== null) return;
  e.preventDefault();
  joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy;
  const d = Math.hypot(dx, dy);
  if (d > JOY_R) {   // основание тянется за пальцем, чтобы быстро менять направление
    joy.ox += dx / d * (d - JOY_R); joy.oy += dy / d * (d - JOY_R);
    dx = dx / d * JOY_R; dy = dy / d * JOY_R;
  }
  joy.dx = dx; joy.dy = dy;
});
canvas.addEventListener('pointerup', endJoy);
canvas.addEventListener('pointercancel', endJoy);

function start() {
  endJoy();
  reset();
  state = 'play';
  overlay.hidden = true;
  initAudio();
}

function showGameOver() {
  ovTitle.textContent = 'БДЫЩ! 🍳';
  ovText.innerHTML =
    `<p>Лена догнала Ваню.</p>
     <p class="big">Ты продержался: ${time.toFixed(1)} с</p>
     <p>${newRecord ? '🏆 Новый рекорд!' : 'Рекорд: ' + record.toFixed(1) + ' с'}</p>`;
  ovButton.textContent = 'Ещё раз';
  overlay.hidden = false;
}

/* ================= ЗВУК ================= */
let actx = null;
function initAudio() {
  try { actx = actx || new AudioContext(); } catch (e) {}
}
function bonk() {
  if (!actx) return;
  const now = actx.currentTime;
  for (const [type, f0, f1, vol] of [['square', 700, 90, .18], ['triangle', 1800, 1500, .12]]) {
    const o = actx.createOscillator(), gain = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, now);
    o.frequency.exponentialRampToValueAtTime(f1, now + .4);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(.001, now + .5);
    o.connect(gain).connect(actx.destination);
    o.start(now); o.stop(now + .5);
  }
}

/* ================= ЛОГИКА ================= */
function update(dt) {
  clock += dt;
  shake = Math.max(0, shake - dt * 30);
  for (const ch of [vanya, lena]) {
    ch.sayT -= dt;
    ch.sayCd -= dt;
  }

  if (state === 'over') {
    hitT += dt;
    if (hitT > 1.1 && overlay.hidden) showGameOver();
    return;
  }
  if (state !== 'play') return;

  time += dt;

  // Ваня
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx -= 1;
  if (keys.ArrowRight || keys.KeyD) dx += 1;
  if (keys.ArrowUp || keys.KeyW) dy -= 1;
  if (keys.ArrowDown || keys.KeyS) dy += 1;
  let power = 1;
  const jm = Math.hypot(joy.dx, joy.dy);
  if (joy.id !== null && jm > 8) {
    dx = joy.dx; dy = joy.dy;
    power = Math.min(1, jm / (JOY_R * .6));
  }
  vanya.moving = dx !== 0 || dy !== 0;
  if (vanya.moving) {
    const len = Math.hypot(dx, dy), sp = VANYA_SPEED * power * dt;
    move(vanya, dx / len * sp, dy / len * sp);
    vanya.phase += dt * 14;
  }

  // Лена
  if (lena.wait > 0) {
    lena.wait -= dt;
    lena.moving = false;
  } else {
    const speed = Math.min(LENA_MAX_SPEED, LENA_START_SPEED + time * LENA_ACCEL);
    const lx = Math.floor(lena.x / T), ly = Math.floor(lena.y / T);
    const vx = Math.floor(vanya.x / T), vy = Math.floor(vanya.y / T);
    let tx = vanya.x, ty = vanya.y;
    if (Math.abs(lx - vx) + Math.abs(ly - vy) > 1) {
      const step = nextStep(lx, ly, vx, vy);
      if (step) { tx = (step[0] + .5) * T; ty = (step[1] + .5) * T; }
    }
    const ddx = tx - lena.x, ddy = ty - lena.y, d = Math.hypot(ddx, ddy);
    if (d > .5) {
      const s = Math.min(speed * dt, d);
      move(lena, ddx / d * s, ddy / d * s);
    }
    lena.moving = true;
    lena.phase += dt * 15;
  }

  // Реплики
  const dist = Math.hypot(vanya.x - lena.x, vanya.y - lena.y);
  if (lena.sayCd <= 0) { lena.say = pick(LENA_PHRASES); lena.sayT = 1.8; lena.sayCd = 3 + Math.random() * 3; }
  if (dist < 130 && vanya.sayCd <= 0) { vanya.say = pick(VANYA_PHRASES); vanya.sayT = 1.4; vanya.sayCd = 4 + Math.random() * 3; }

  // Поймала!
  if (dist < CATCH_DIST) {
    state = 'over';
    hitT = 0; shake = 14;
    vanya.moving = lena.moving = false;
    lena.say = 'Попался!'; lena.sayT = 2;
    vanya.sayT = 0;
    bonk();
    if (time > record) {
      record = time; newRecord = true;
      try { localStorage.setItem('begiVanyaRecord', String(record)); } catch (e) {}
    }
  }
}

/* ================= ОТРИСОВКА ================= */
let sprites = null;

function bobOf(ch) { return ch.moving ? Math.abs(Math.sin(ch.phase)) * 4 : 0; }

function drawCharacter(ch, sprite, squash) {
  const tilt = ch.moving ? Math.sin(ch.phase) * 0.07 : 0;
  ctx.save();
  ctx.translate(ch.x, ch.y);
  ctx.rotate(tilt);
  if (squash) ctx.scale(1.25, 0.72);
  ctx.drawImage(sprite, -100 * S, -302 * S - bobOf(ch), 200 * S, 320 * S);
  ctx.restore();
}

function drawPan() {
  const side = vanya.x < lena.x ? -1 : 1;
  const hx = lena.x + side * 17, hy = lena.y - 19 - bobOf(lena);
  const dist = Math.hypot(vanya.x - lena.x, vanya.y - lena.y);
  let ang = -1.2;
  if (state === 'play' && dist < 110) ang += Math.sin(clock * 16) * 1.0;
  if (state === 'over') ang = hitT < .12 ? -1.2 + hitT / .12 * 1.9 : .7;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.scale(side, 1);
  ctx.rotate(ang);
  rr(ctx, 0, -3, 22, 6, 3, '#6b4226');
  circle(ctx, 34, 0, 13, '#3a3a3a', OUTLINE, 2.5);
  circle(ctx, 34, 0, 9, '#555', null);
  ctx.beginPath(); ctx.arc(34, 0, 9, -2.4, -1.2);
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

function bubble(text, x, y) {
  ctx.font = 'bold 15px Nunito, "Segoe UI", sans-serif';
  const w = ctx.measureText(text).width + 18, h = 26;
  const bx = Math.max(4, Math.min(W - w - 4, x - w / 2)), by = y - h;
  ctx.beginPath();
  ctx.moveTo(x - 6, by + h - 1); ctx.lineTo(x, by + h + 8); ctx.lineTo(x + 6, by + h - 1);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 2; ctx.stroke();
  rr(ctx, bx, by, w, h, 10, '#fff');
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 5, by + h - 3, 10, 4);
  ctx.fillStyle = OUTLINE; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + w / 2, by + h / 2 + 1);
  ctx.textBaseline = 'alphabetic';
}

function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = '#ffd84a'; ctx.fill();
  ctx.strokeStyle = OUTLINE; ctx.lineWidth = 1.5; ctx.stroke();
}

function draw() {
  ctx.setTransform(scaleK, 0, 0, scaleK, 0, 0);
  ctx.fillStyle = '#2b1d16';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
  ctx.drawImage(bg, 0, 0, W, H);

  // мебель и персонажи — в порядке «кто ниже на экране, тот ближе»
  const list = FURNITURE.map(f => ({ y: (f.y + f.h) * T, draw: () => drawFurniture(f) }));
  if (sprites) {
    list.push({ y: vanya.y, draw: () => drawCharacter(vanya, sprites.vanya, state === 'over') });
    list.push({ y: lena.y, draw: () => { drawCharacter(lena, sprites.lena); drawPan(); } });
  }
  list.sort((a, b) => a.y - b.y).forEach(o => o.draw());

  if (sprites && state !== 'menu') {
    const headY = ch => ch.y - 302 * S + 30 * S - bobOf(ch);
    if (state === 'over') {
      for (let i = 0; i < 3; i++) {
        const a = clock * 4 + i * 2.09;
        star(vanya.x + Math.cos(a) * 26, vanya.y - 60 + Math.sin(a) * 8, 7);
      }
      const k = Math.min(1, hitT / .15);
      ctx.save();
      ctx.translate(vanya.x, vanya.y - 90);
      ctx.scale(k, k);
      ctx.rotate(-.12);
      ctx.font = '36px "Rubik Mono One", "Arial Black", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 6; ctx.strokeStyle = '#c62828'; ctx.strokeText('БДЫЩ!', 0, 0);
      ctx.fillStyle = '#ffd84a'; ctx.fillText('БДЫЩ!', 0, 0);
      ctx.restore();
    } else {
      if (vanya.sayT > 0) bubble(vanya.say, vanya.x, headY(vanya) - 8);
    }
    if (lena.sayT > 0) bubble(lena.say, lena.x, headY(lena) - 8);
  }
  ctx.restore();

  // счёт
  if (state === 'play' || state === 'over') {
    const txt = `⏱ ${time.toFixed(1)} с     🏆 ${record.toFixed(1)} с`;
    ctx.font = 'bold 18px Nunito, "Segoe UI", sans-serif';
    const w = ctx.measureText(txt).width + 28;
    rr(ctx, 10, 6, w, 28, 14, 'rgba(255,255,255,.9)');
    ctx.fillStyle = OUTLINE; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, 24, 21);
    ctx.textBaseline = 'alphabetic';
  }

  // джойстик под пальцем
  if (joy.id !== null) {
    const rect = canvas.getBoundingClientRect(), k = W / rect.width;
    const bx = (joy.ox - rect.left) * k, by = (joy.oy - rect.top) * k;
    circle(ctx, bx, by, JOY_R * k, 'rgba(255,255,255,.18)', 'rgba(255,255,255,.6)', 3);
    circle(ctx, bx + joy.dx * k, by + joy.dy * k, JOY_R * k * .45, 'rgba(255,255,255,.75)', OUTLINE, 2);
  }
}

/* ================= ЗАПУСК ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

buildBackground();
if (document.fonts) document.fonts.ready.then(buildBackground);  // перерисовать подписи комнат нужным шрифтом
reset();
requestAnimationFrame(frame);

Promise.all([
  makeSprite(vanyaBodySvg(), drawVanya(), PHOTO.vanya),
  makeSprite(lenaBodySvg(), drawLena(), PHOTO.lena),
]).then(([v, l]) => {
  sprites = { vanya: v, lena: l };
  state = 'menu';
  ovButton.disabled = false;
  ovButton.textContent = 'Играть';
});
</script>
</body>
